spring.application.name=langchain4j-agent

spring.config.import=optional:file:.env[.properties],optional:file:langchain4j-agent/.env[.properties]
langchain4j.open-ai.chat-model.base-url=${LLM_BASE_URL}
langchain4j.open-ai.chat-model.api-key=${LLM_API_KEY}
langchain4j.open-ai.chat-model.model-name=${LLM_MODEL}
langchain4j.open-ai.chat-model.temperature=0.3
langchain4j.open-ai.chat-model.max-tokens=1024
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false

agent.tools.backend=${AGENT_TOOLS_BACKEND:${USE_LOCAL_TOOLS:local}}
agent.tools.mcp.server-url=${MCP_SERVER:http://127.0.0.1:7001/mcp}
agent.tools.mcp.log-traffic=false
