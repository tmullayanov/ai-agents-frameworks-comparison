spring.application.name=java-agent
spring.config.import=optional:file:.env[.properties],optional:file:java-agent/.env[.properties]
spring.ai.openai.base-url=${LLM_BASE_URL}
spring.ai.openai.api-key=${LLM_API_KEY}
spring.ai.openai.chat.model=${LLM_MODEL}
agent.structured-output.native-enabled=false
agent.structured-output.validate-schema=true
agent.tools.backend=local

spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.name=java-agent
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.support.url=${MCP_SERVER}
spring.ai.mcp.client.streamable-http.connections.support.endpoint=/mcp

server.port=8000
